<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131416" />
    <!-- The build rewrites the title and description per route from src/app/routes.ts. -->
    <title>Rig Lab</title>
    <meta
      name="description"
      content="Pick every part of a PC, see it assemble in 3D, and get sourced performance estimates before you buy."
    />
    <!-- No icon until Phase 2 draws Rig Lab's icons; this also stops a /favicon.ico request. -->
    <link rel="icon" href="data:," />
    <!-- Vite rewrites this to the hashed file the CSS uses. Without crossorigin it loads twice. -->
    <link
      rel="preload"
      href="/src/styles/fonts/rig-lab-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Same key and colour as src/state/theme.ts; theme.test.ts runs this script. -->
    <script>
      // Rig Lab opens dark. A visitor's light choice is restored before the first paint.
      try {
        if (localStorage.getItem('rig-lab-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f3f3f1';
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Rig Lab needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
