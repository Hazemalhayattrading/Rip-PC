name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Installs the Chromium build that matches the pinned @playwright/test (1.56.1).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Typecheck, lint, unit tests with coverage gates, production build, e2e smoke.
      - run: npm run verify

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # BUILD_PROMPT §8 budgets, measured on the production build (docs/qa/test-plan.md §4 and
  # Appendix B). Every threshold comes from tests/perf/budget.json. Owner: qa-lead.
  budgets:
    name: Performance budgets
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The Chromium build that matches the pinned @playwright/test (1.56.1).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Lighthouse uses the same Chromium 1194 as the tests, not the runner's Google Chrome.
      - name: Point Lighthouse at Playwright's Chromium
        run: echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      - id: build
        run: npm run build

      # Once the build exists every budget is measured, even after one misses, so a single run
      # shows every miss. Any miss still fails the job.
      - name: Initial JS budget (BUILD_PROMPT §8)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run perf:bundle

      - name: Lighthouse CI, mobile
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run perf:lhci

      - name: Lighthouse CI, desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run perf:lhci:desktop

      - name: Web vitals, LCP and CLS at 390 and 1440 px, CPU x1 and x4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run perf:vitals

      - name: Upload budget reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-budgets
          path: |
            artifacts/perf/
            artifacts/lhci/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
